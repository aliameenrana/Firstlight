name: Firstlight
options:
  bundleIdPrefix: com.aliameenrana
  deploymentTarget:
    iOS: "26.0"
targets:
  Firstlight:
    type: application
    platform: iOS
    sources:
      - Firstlight
      - path: Sounds
        optional: true
        buildPhase: resources
    info:
      path: Firstlight/Info.plist
      properties:
        CFBundleDisplayName: Firstlight
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        NSAlarmKitUsageDescription: Firstlight schedules your alarms.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aliameenrana.firstlight
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
